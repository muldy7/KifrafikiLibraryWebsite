{% extends "base.html" %}

{% block content %}

{% if user.is_authenticated %}
  <p>Welcome, {{ user.username }}!</p>
  
  <!-- Logout Form -->
  <form action="{% url 'logout' %}" method="post">
    {% csrf_token %}
    <button type="submit">Log Out</button>
  </form>
{% else %}
  <a href="{% url 'login' %}">Log In</a>
{% endif %}

{% endblock %}
